name: Test and release Kimi Code Switch
on:
  push:
    tags: ["v*"]
    branches: ["master"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npm run build:server
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate tag and single version source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          if (pkg.name !== "kimi-code-switch" || pkg.version !== lock.version) throw new Error("Package metadata mismatch");
          if (process.env.REF_TYPE === "tag" && (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`)) throw new Error("Tag must equal package version");
          JS
      - name: Check release runner architecture
        run: test "$(uname -m)" = arm64
      - run: npm run build
      - name: Verify standalone macOS arm64 artifact
        run: npm run check:package
      - name: Render Homebrew formula
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          SHA="$(awk '{print $1}' "dist-release/kimi-code-switch-${VERSION}-macos-arm64.tar.gz.sha256")"
          python3 scripts/render_homebrew_formula.py --version "$VERSION" --sha256 "$SHA" --output dist-release/kimi-code-switch.rb
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-code-switch-macos-arm64
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
            dist-release/*.rb
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kimi-code-switch-macos-arm64
          path: dist-release
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          export NOTES_FILE
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const version = process.env.VERSION.slice(1);
          const sections = ["zh-CN", "en-US"].map(locale => {
            const source = readFileSync(`CHANGELOGS/${locale}.md`, "utf8");
            const lines = source.split("\n");
            const start = lines.findIndex(line => line.startsWith(`## [${version}]`));
            if (start < 0) throw new Error(`Missing ${locale} changelog for ${version}`);
            const end = lines.findIndex((line, index) => index > start && line.startsWith("## ["));
            return lines.slice(start + 1, end < 0 ? undefined : end).join("\n").trim();
          });
          if (sections.some(section => !section)) throw new Error("Empty changelog section");
          writeFileSync(process.env.NOTES_FILE, sections.join("\n\n---\n\n") + "\n");
          JS
          gh release create "$VERSION" dist-release/*.tar.gz dist-release/*.sha256 dist-release/*.rb --verify-tag --title "$VERSION" --notes-file "$NOTES_FILE"
